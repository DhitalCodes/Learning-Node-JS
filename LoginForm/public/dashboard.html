<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .welcome { text-align: center; padding: 30px; }
        .welcome h1 { font-size: 32px; color: #333; }
        .welcome p { font-size: 18px; color: #666; margin: 20px 0; }
        .user-box { background: #f5f7ff; padding: 15px; border-radius: 10px; margin: 20px 0; }
        .logout { display: inline-block; padding: 12px 35px; background: #dc3545; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
        .logout:hover { background: #c82333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="welcome">
                <h1>🎉 Welcome!</h1>
                <div class="user-box">
                    <strong>Logged in as: <span><%= username %></span></strong>
                </div>
                <p>You have successfully logged in!</p>
                <a href="/" class="logout">🚪 Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
