<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>📝 Sign Up</h1>

            <div id="messageContainer"></div>

            <form action="/signup" method="POST" id="signupForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose username" required />
                    <small id="userHelp">3-20 characters (letters & numbers only)</small>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" name="password" placeholder="Choose password" required />
                    <small id="passHelp">Min 4 chars with letter and number</small>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required />
                    <small id="confirmHelp">Passwords must match</small>
                </div>

                <button type="submit" class="btn" id="signupBtn">Create Account</button>
            </form>

            <div class="links">
                Already have an account? <a href="/">Login</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');
            const container = document.getElementById('messageContainer');
            if (error) {
                container.innerHTML = `<div class="message error">${error}</div>`;
            }
        })();
    </script>
</body>
</html>
