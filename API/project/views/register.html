<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="container">
  <h1>Register</h1>
  <form id="registerForm">
    <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" required></div>
    <div class="form-group"><label for="email">Email</label><input type="email" id="email" required></div>
    <div class="form-group"><label for="password">Password (min 8 chars)</label><input type="password" id="password" minlength="8" required></div>
    <div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" required></div>
    <button type="submit">Create Account</button>
    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>
  </form>
  <div class="link"><p>Already have an account? <a href="/login">Sign in</a></p></div>
</div>
<script src="/js/register.js"></script>
</body></html>
