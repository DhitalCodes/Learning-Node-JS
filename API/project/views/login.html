<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="container">
  <h1>Login</h1>
  <form id="loginForm">
    <div class="form-group"><label for="identifier">Username, Email, or Phone</label><input type="text" id="identifier" required placeholder="Enter username, email, or phone"></div>
    <div class="form-group"><label for="password">Password</label><input type="password" id="password" required></div>
    <div class="admin-checkbox"><input type="checkbox" id="isAdmin"><label for="isAdmin">Login as Admin</label></div>
    <button type="submit">Sign In</button>
    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>
  </form>
  <div class="link"><p>Don't have an account? <a href="/register">Register here</a></p></div>
</div>
<script src="/js/login.js"></script>
</body></html>
